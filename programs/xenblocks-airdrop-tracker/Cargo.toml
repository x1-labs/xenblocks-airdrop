[package]
name = "xenblocks-airdrop-tracker"
version = "0.1.0"
description = "On-chain airdrop tracking program for Xenblocks tokens"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "xenblocks_airdrop_tracker"

[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = [
    'cfg(feature, values("custom-heap", "custom-panic", "anchor-debug"))',
    # Anchor 1.x expands `target_os = "solana"` in the #[program] macro, which
    # the host target does not know about.
    'cfg(target_os, values("solana"))',
]

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = "1.1.2"
