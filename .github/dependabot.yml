version: 2

updates:
  # JavaScript dependencies. Must be `bun`, not `npm`: `npm` resolves
  # package.json with npm's resolver and leaves bun.lock untouched, so every
  # PR fails `bun install --frozen-lockfile`. `bun` updates both.
  # Trade-off: the bun ecosystem supports version updates only, not security
  # updates. Dependabot alerts still fire, and CI gates on `bun audit --prod`.
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    open-pull-requests-limit: 10
    labels:
      - dependencies
    groups:
      # Keep the lint/format/test toolchain in a single PR
      dev-tooling:
        dependency-type: development
        update-types:
          - minor
          - patch
      solana:
        patterns:
          - "@solana/*"
      production-minor-patch:
        dependency-type: production
        update-types:
          - minor
          - patch

  # GitHub Actions used by the CI and publish workflows.
  # Actions are pinned to commit SHAs; Dependabot bumps the SHA and the
  # trailing version comment together.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    labels:
      - dependencies
      - ci
    groups:
      actions:
        patterns:
          - "*"

  # Dockerfile base image (oven/bun)
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    labels:
      - dependencies
      - docker

  # Anchor program crates
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    labels:
      - dependencies
      - rust
    groups:
      cargo:
        update-types:
          - minor
          - patch
