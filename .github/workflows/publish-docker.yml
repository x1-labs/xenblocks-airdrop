name: Build and Push Docker Image

permissions:
  contents: read
  packages: write

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run build without pushing to registry"
        required: false
        default: false
        type: boolean
      no_cache:
        description: "Build without Docker layer cache"
        required: false
        default: false
        type: boolean
  push:
    branches:
      - main
      - docker-ci
    paths:
      - "src/**"
      - package.json
      - bun.lock
      - .bun-version
      - tsconfig.json
      - Dockerfile
      - ".dockerignore"
      - ".github/workflows/publish-docker.yml"

env:
  REGISTRY: ghcr.io

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  build:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: ${{ github.event.inputs.dry_run != 'true' }}
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ github.repository }}:latest
          cache-from: ${{ github.event.inputs.no_cache != 'true' && format('type=registry,ref={0}/{1}:cache', env.REGISTRY, github.repository) || '' }}
          cache-to: type=registry,mode=max,image-manifest=true,oci-mediatypes=true,ref=${{ env.REGISTRY }}/${{ github.repository }}:cache

      - name: Output image info
        run: |
          echo "## Docker Image Published" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Registry:** ${{ env.REGISTRY }}" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** ${{ github.repository }}" >> $GITHUB_STEP_SUMMARY
          echo "**SHA Tag:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "**Platform:** linux/amd64" >> $GITHUB_STEP_SUMMARY
          if [[ "${{ github.event.inputs.dry_run }}" == "true" ]]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "⚠️ **Dry run** - image was not pushed to registry" >> $GITHUB_STEP_SUMMARY
          fi

  deploy-testnet:
    needs: build
    if: ${{ github.event.inputs.dry_run != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: 2770147
          private-key: ${{ secrets.GH_APP_INFRAFC_DEPLOY_KEY }}
          owner: x1-labs
          repositories: infrafc

      - name: Trigger deployment (testnet)
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh workflow run deploy-service.yml \
            --repo x1-labs/infrafc \
            --ref main \
            -f service="xenblocks-airdrop" \
            -f environment="testnet" \
            -f image_tag="${{ github.sha }}" \
            -f commit_sha="${{ github.sha }}" \
            -f repo_url="${{ github.server_url }}/${{ github.repository }}"

  deploy-mainnet:
    needs: deploy-testnet
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: 2770147
          private-key: ${{ secrets.GH_APP_INFRAFC_DEPLOY_KEY }}
          owner: x1-labs
          repositories: infrafc

      - name: Trigger deployment (mainnet)
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh workflow run deploy-service.yml \
            --repo x1-labs/infrafc \
            --ref main \
            -f service="xenblocks-airdrop" \
            -f environment="mainnet" \
            -f image_tag="${{ github.sha }}" \
            -f commit_sha="${{ github.sha }}" \
            -f repo_url="${{ github.server_url }}/${{ github.repository }}"
